name: Lint

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Install linters
        run: make tools

      - name: Lint YAML
        run: uv run yamllint .

      - name: Lint GitHub Actions
        run: tools/bin/actionlint

      - name: Lint Dockerfile
        run: tools/bin/hadolint --failure-threshold warning Dockerfile

      - name: Lint Actions Security
        run: uv run zizmor .

      # No setup-go: make lint-go runs golangci-lint on the go.mod
      # toolchain (GOTOOLCHAIN), which Go downloads on first use, so a newer
      # runner Go cannot break type-checking.
      - name: Lint Go
        run: make lint-go
